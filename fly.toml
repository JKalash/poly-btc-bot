# Fly.io deployment: single always-on machine in iad (Ashburn, US-East),
# embedded mode (api+engine in one process, PGlite on the volume) + web.
#
# Public surface: ONLY the web app (port 3000) behind Fly's HTTPS edge at
# https://b5p-collector.fly.dev — protected by the operator login (scrypt,
# rate-limited). The API listens only inside the VM; the dashboard reaches it
# through Next's same-origin /api proxy. Paper system: no keys, no funds.
#
# First deploy (after `fly auth login`):
#   fly launch --copy-config --no-deploy --name <app>
#   fly volumes create b5p_data --region iad --size 10
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32) OPERATOR_PASSWORD_HASH='<hash>'
#   fly deploy
app = "b5p-collector"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  EMBED_ENGINE = "1"
  PGLITE_DIR = "/data/pglite"
  # 0.0.0.0 is safe here: the machine has no public IP (no [[services]] defined);
  # only fly proxy / WireGuard over the private network can reach it.
  API_HOST = "0.0.0.0"
  API_PORT = "8787"
  NODE_ENV = "production"

[processes]
  app = "node scripts/prod.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# "Machine started" only means the VM booted; it says nothing about whether the
# API is still answering. On 2026-08-05 the capture writer saturated the shared
# PGlite connection and /api/state began resetting sockets while Fly still
# reported the release as healthy. This probe reaches the Fastify API through
# the web proxy, so a wedged event loop in either process now shows up.
#
# Deliberately slack: /api/healthz is unauthenticated and cheap, the grace
# period covers migrate + engine boot, and the timeout is long enough that a
# write burst does not restart the machine. It fails on no answer, not a slow
# one — a restart loop would be worse than the condition it is detecting.
[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "120s"
  method = "GET"
  path = "/api/healthz"

[mounts]
  source = "b5p_data"
  destination = "/data"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
